# Local Postgres for development and tests (OrbStack or Docker): pnpm db:up
# Port 54329 so it doesn't clash with another Postgres on 5432.
services:
  postgres:
    image: postgres:17-alpine
    container_name: michi-postgres
    environment:
      POSTGRES_USER: michi
      POSTGRES_PASSWORD: michi
      POSTGRES_DB: michi
    ports:
      - "54329:5432"
    volumes:
      - michi-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U michi -d michi"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  michi-postgres:
